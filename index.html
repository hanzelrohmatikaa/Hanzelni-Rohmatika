<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanzelni Rohmatika</title>
<style>
body { margin:0; font-family: sans-serif; background:#ffc9c9; }
.wrap { max-width:600px; margin:0 auto; }
.header {
  position: sticky; top:0; background:#ff8fa3; color:white;
  text-align:center; padding:15px; font-weight:bold; z-index:10;
}
.card { background:white; margin:20px; padding:20px; border-radius:20px; text-align:center; overflow:hidden; }
.foto-profil { width:150px; height:150px; object-fit:cover; border-radius:50%; animation: melayang 2s infinite; }
.galeri img { width:100%; height:auto; display:block; border-radius:15px; margin-top:15px; }
@keyframes melayang { 0%,100%{ transform:translateY(0)} 50%{ transform:translateY(-10px)} }
.reveal { opacity:0; transition: all 0.8s ease; }
.dari-kiri { transform: translateX(-100px); }
.dari-kanan { transform: translateX(100px); }
.dari-bawah { transform: translateY(80px); }
.ngezoom { transform: scale(0.5); }
.muter { transform: rotate(-10deg) scale(0.7); }
.muncul { opacity:1; transform:none; }
</style>
</head>
<body>

<div class="header">Hanzelni Rohmatika ❤️</div>

<div class="wrap">

<div class="card">
  <img class="foto-profil" src="foto.jpg.jpg">
  <h2>Hanzelni Rohmatika</h2>
  <p>Halo! Ini adalah biodata saya</p>
  <p><b>Hobi:</b> Mendengarkan musik & Jalan-jalan</p>
  <p><b>Makanan Favorit:</b> Seblak & Mie Ayam</p>
  <p><b>Film Favorit:</b> Film Drama & Komedi</p>
  <p>❤️</p>
</div>

<div class="card galeri reveal dari-kiri">
  <h3>Hobi Aku</h3>
  <img src="hobi.jpg">
</div>

<div class="card galeri reveal dari-kanan">
  <h3>Makanan Favorit Aku</h3>
  <img src="makanan.jpg">
</div>

<div class="card galeri reveal ngezoom">
  <h3>Film Favorit Aku</h3>
  <img src="film.jpg">
</div>

<div class="card galeri reveal muter">
  <h3>Foto Aku Lagi</h3>
  <img src="foto.jpg.jpg">
</div>

<div class="card galeri reveal dari-bawah">
  <h3>Terima kasih sudah mampir ❤️</h3>
</div>

</div>

<script>
let semua = document.querySelectorAll('.reveal');
let pengamat = new IntersectionObserver((e)=>{
  e.forEach(item=>{
    if(item.isIntersecting){ item.target.classList.add('muncul'); }
  });
});
semua.forEach(el=> pengamat.observe(el));
</script>
</body>
</html>
